server {
    listen 80;
    root /usr/share/nginx/html;

    # The prefix is kept, not stripped. See README: a path that works at / and
    # not at /dub/ is a bug that only appears in production.
    location /dub/ {
        try_files $uri $uri/ /dub/index.html;
    }

    # Exempt from any future access gating, and cheap enough to be polled.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
