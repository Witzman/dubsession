<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p01 — Basic</title>
<style>
  :root {
    --bg: #0b0d0e; --panel: #131718; --line: #222829;
    --ink: #cdd3d2; --dim: #6b7574; --hot: #7fd6c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 13px; font-weight: 400; color: var(--dim); margin: 0 0 20px; letter-spacing: .08em; }
  h1 b { color: var(--ink); font-weight: 400; }
  button {
    font: inherit; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); padding: 10px 20px; cursor: pointer;
  }
  button:hover { border-color: var(--hot); color: var(--hot); }
  .row { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
  .row label { width: 132px; color: var(--dim); flex: none; }
  .row input { flex: 1; accent-color: var(--hot); }
  .row output { width: 68px; text-align: right; color: var(--hot); flex: none; }
  #bars { margin: 20px 0 8px; color: var(--dim); }
  #steps { display: flex; gap: 3px; margin-bottom: 20px; }
  #steps i { flex: 1; height: 5px; background: var(--line); }
  #steps i.on { background: var(--hot); }
  fieldset { border: 1px solid var(--line); padding: 12px 14px; margin: 0 0 14px; }
  legend { color: var(--dim); padding: 0 6px; }
</style>
</head>
<body>
<main>
  <h1>dubsession <b>p01 — Basic</b> · 125 BPM · G minor · not the surface, just the engine</h1>

  <button id="go">start</button>

  <div id="bars">bar — · step —</div>
  <div id="steps"></div>

  <fieldset>
    <legend>the set</legend>
    <div class="row"><label>tempo</label><input id="bpm" type="range" min="110" max="132" step="1" value="125"><output id="bpm_v"></output></div>
    <div class="row"><label>density</label><input id="dens" type="range" min="0" max="1" step="0.01" value="0.7"><output id="dens_v"></output></div>
  </fieldset>

  <fieldset>
    <legend>the chord</legend>
    <div class="row"><label>cutoff</label><input id="cut" type="range" min="200" max="6000" step="10" value="2200"><output id="cut_v"></output></div>
    <div class="row"><label>decay</label><input id="dec" type="range" min="0.2" max="2.5" step="0.05" value="1.2"><output id="dec_v"></output></div>
  </fieldset>

  <fieldset>
    <legend>the space</legend>
    <div class="row"><label>echo send</label><input id="dly" type="range" min="0" max="1" step="0.01" value="0.35"><output id="dly_v"></output></div>
    <div class="row"><label>echo feedback</label><input id="fbk" type="range" min="0" max="0.92" step="0.01" value="0.62"><output id="fbk_v"></output></div>
    <div class="row"><label>room send</label><input id="rev" type="range" min="0" max="1" step="0.01" value="0.3"><output id="rev_v"></output></div>
    <div class="row"><label>sends drift</label><input id="drift" type="range" min="0" max="1" step="0.01" value="0.5"><output id="drift_v"></output></div>
  </fieldset>

  <fieldset>
    <legend>out</legend>
    <div class="row"><label>master</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"><output id="vol_v"></output></div>
  </fieldset>
</main>

<script>
// ---------------------------------------------------------------------------
// p01 — the centre of the parent's dub round, rebuilt in Web Audio.
//
// "Dub 221 Basic", 125 BPM, G minor: a four-on-the-floor, the chord on EVERY
// offbeat eighth (the Basic Channel figure), eighth-note hats, ONE rimshot a
// bar, and a sub that plays the root then the flat seventh under the second
// half of the bar.  notes/reference/dub-techno.md, "The centre".
//
// Two things from that document are in here on purpose, because they are what
// makes it dub rather than house:
//   - swing 0.08 on the hat and the rim ONLY; kick and bass stay dead straight
//   - the two sends move on COPRIME bar counts (echo/3, room/8) so they are
//     never both loud
// ---------------------------------------------------------------------------

const STEPS = 16;                 // one bar on a 1/16 grid
const SWING = 0.08;               // dub's pocket, and it is small

// G minor. MIDI numbers, turned into hertz at the point of use.
const SUB_ROOT = 31;              // G1
const SUB_FLAT7 = 29;             // F1, under the second half of the bar
const CHORD = [55, 58, 62];       // G3 Bb3 D3 — root, +3, +7 semitones

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

let ac = null, running = false;
let step = 0, bar = 0, nextNoteTime = 0, timer = null;
const LOOKAHEAD = 0.1, TICK = 25;

// The audio graph, built once and kept. Voices are created per event and are
// allowed to die; the buses below are not.
let master, comp, dryBus, delaySend, revSend, delayNode, delayFbk, delayTone, conv, noiseBuf;

const ui = id => document.getElementById(id);
const val = id => parseFloat(ui(id).value);

function buildGraph() {
  master = ac.createGain();
  master.gain.value = val('vol');

  comp = ac.createDynamicsCompressor();
  comp.threshold.value = -12; comp.ratio.value = 3;
  comp.attack.value = 0.005; comp.release.value = 0.15;
  comp.connect(master); master.connect(ac.destination);

  dryBus = ac.createGain(); dryBus.connect(comp);

  // The dub delay. Dotted eighth, tempo-locked, with a low-pass inside the
  // feedback loop so each repeat is darker than the last — that darkening is
  // the sound, not a side effect.
  delaySend = ac.createGain(); delaySend.gain.value = val('dly');
  delayNode = ac.createDelay(2.0);
  delayNode.delayTime.value = dottedEighth();
  delayFbk = ac.createGain(); delayFbk.gain.value = val('fbk');
  delayTone = ac.createBiquadFilter();
  delayTone.type = 'lowpass'; delayTone.frequency.value = 1800; delayTone.Q.value = 0.7;

  delaySend.connect(delayNode);
  delayNode.connect(delayTone);
  delayTone.connect(delayFbk);
  delayFbk.connect(delayNode);      // the loop
  delayTone.connect(comp);

  // The room. The impulse response is synthesised, not downloaded: a noise
  // burst under an exponential decay, tilted bright. Costs nothing to ship.
  conv = ac.createConvolver();
  conv.buffer = makeIR(4.0, 2.4);
  revSend = ac.createGain(); revSend.gain.value = val('rev');
  revSend.connect(conv); conv.connect(comp);

  noiseBuf = makeNoise(2.0);
}

function makeNoise(seconds) {
  const b = ac.createBuffer(1, ac.sampleRate * seconds, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function makeIR(seconds, decay) {
  const n = Math.floor(ac.sampleRate * seconds);
  const b = ac.createBuffer(2, n, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    for (let i = 0; i < n; i++) {
      const t = i / n;
      // Bright: the noise is high-passed by differencing, then decayed.
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
    }
    // A short pre-delay keeps the transient audible before the room answers.
    const pre = Math.floor(ac.sampleRate * 0.012);
    for (let i = n - 1; i >= pre; i--) d[i] = d[i - pre];
    for (let i = 0; i < pre; i++) d[i] = 0;
  }
  return b;
}

function dottedEighth() {
  const beat = 60 / val('bpm');
  return beat * 0.75;              // dotted eighth = 3/4 of a beat
}

// --- voices ----------------------------------------------------------------
// Each returns nothing; each connects itself, schedules itself and stops.

function send(node, t, dlyAmt, revAmt) {
  node.connect(dryBus);
  if (dlyAmt > 0) { const g = ac.createGain(); g.gain.value = dlyAmt; node.connect(g); g.connect(delaySend); }
  if (revAmt > 0) { const g = ac.createGain(); g.gain.value = revAmt; node.connect(g); g.connect(revSend); }
}

function kick(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(125, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.045);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.9, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  o.connect(g);
  send(g, t, 0, 0.04);             // the kick stays dry. Dub is not a wash at the bottom.
  o.start(t); o.stop(t + 0.3);
}

function hat(t, vel) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; s.playbackRate.value = 1 + Math.random() * 0.1;
  f.type = 'bandpass'; f.frequency.value = 8200; f.Q.value = 1.4;
  g.gain.setValueAtTime(vel * 0.16, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  s.connect(f); f.connect(g);
  send(g, t, 0.15, 0.25);
  s.start(t); s.stop(t + 0.06);
}

function rim(t) {
  const o = ac.createOscillator(), n = ac.createBufferSource();
  const f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = 1750;
  n.buffer = noiseBuf; n.playbackRate.value = 1.7;
  f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 2.2;
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(f); n.connect(f); f.connect(g);
  send(g, t, 0.75, 0.6);           // one hit a bar, drenched. That is the punctuation.
  o.start(t); o.stop(t + 0.06); n.start(t); n.stop(t + 0.06);
}

function sub(t, midi, dur) {
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = 'sine'; o.frequency.value = mtof(midi);
  f.type = 'lowpass'; f.frequency.value = 200;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.75, t + 0.02);
  g.gain.setValueAtTime(0.75, t + dur - 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g);
  send(g, t, 0, 0);                // the sub goes nowhere but out
  o.start(t); o.stop(t + dur + 0.02);
}

function stab(t) {
  // Saw, 24 dB low-pass, sustain zero, a second envelope snapping the cutoff.
  // notes/reference/dub-techno.md names this as where the genre lives.
  const g = ac.createGain();
  const f1 = ac.createBiquadFilter(), f2 = ac.createBiquadFilter();
  f1.type = f2.type = 'lowpass';
  f1.Q.value = 6; f2.Q.value = 0.7;
  const peak = val('cut'), floor = Math.max(180, peak * 0.14), dec = val('dec');
  for (const f of [f1, f2]) {
    f.frequency.setValueAtTime(peak, t);
    f.frequency.exponentialRampToValueAtTime(floor, t + 0.18);
  }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dec);

  const oscs = [];
  for (const m of CHORD) {
    for (const cents of [-6, 6]) {          // two saws per note, barely apart
      const o = ac.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = mtof(m);
      o.detune.value = cents;
      o.connect(f1); oscs.push(o);
    }
  }
  f1.connect(f2); f2.connect(g);
  send(g, t, 0.9, 0.7);            // the chord is what the room and the echo eat
  for (const o of oscs) { o.start(t); o.stop(t + dec + 0.05); }
}

// --- the clock -------------------------------------------------------------

function stepTime(s) {
  const beat = 60 / val('bpm');
  const sixteenth = beat / 4;
  // Swing is per voice, so it is applied at the voice, not here.
  return sixteenth;
}

function schedule(s, t) {
  const d = val('dens');
  const beat = 60 / val('bpm');
  const sixteenth = beat / 4;
  const swung = t + (s % 2 === 1 ? SWING * sixteenth : 0);

  if (s % 4 === 0) kick(t);                       // four on the floor, straight
  if (s % 2 === 0) hat(swung, s % 4 === 2 ? 1 : 0.55);   // eighth hats, swung
  if (s === 10) rim(swung);                       // one a bar, drenched

  if (s === 0) sub(t, SUB_ROOT, beat * 1.9);
  if (s === 8) sub(t, SUB_FLAT7, beat * 1.9);

  // The chord on every offbeat eighth — the Basic Channel figure. Density
  // thins it from the back: at low density only the strong offbeats survive.
  if (s % 4 === 2) {
    const strength = (s === 2 || s === 10) ? 1 : 0.55;
    if (d >= 1 - strength * 0.9) stab(t);
  }
}

function modulate(t) {
  // "the echo over three bars and the room over eight, so the two are never
  // both loud." Coprime bar counts, deliberately never peaking together.
  const amt = val('drift');
  const beat = 60 / val('bpm'), barLen = beat * 4;
  const phase = (bar + step / STEPS);
  const e = Math.sin(2 * Math.PI * phase / 3) * 0.5 + 0.5;
  const r = Math.sin(2 * Math.PI * phase / 8) * 0.5 + 0.5;
  const base = val('dly'), rbase = val('rev');
  delaySend.gain.setTargetAtTime(base * (1 - amt * 0.7 + amt * 0.7 * e * 1.4), t, 0.08);
  revSend.gain.setTargetAtTime(rbase * (1 - amt * 0.7 + amt * 0.7 * r * 1.4), t, 0.2);
}

function tick() {
  while (nextNoteTime < ac.currentTime + LOOKAHEAD) {
    schedule(step, nextNoteTime);
    modulate(nextNoteTime);
    nextNoteTime += stepTime(step);
    step = (step + 1) % STEPS;
    if (step === 0) bar++;
  }
}

// --- surface ---------------------------------------------------------------

const steps = ui('steps');
for (let i = 0; i < STEPS; i++) steps.appendChild(document.createElement('i'));

function paint() {
  if (running) {
    const kids = steps.children;
    for (let i = 0; i < STEPS; i++) kids[i].classList.toggle('on', i === step);
    ui('bars').textContent = `bar ${bar} · step ${step} · ctx ${ac.currentTime.toFixed(1)}s`;
  }
  requestAnimationFrame(paint);
}
requestAnimationFrame(paint);

const fmt = {
  bpm: v => v.toFixed(0), dens: v => v.toFixed(2), cut: v => v.toFixed(0) + ' Hz',
  dec: v => v.toFixed(2) + ' s', dly: v => v.toFixed(2), fbk: v => v.toFixed(2),
  rev: v => v.toFixed(2), drift: v => v.toFixed(2), vol: v => v.toFixed(2),
};
for (const id of Object.keys(fmt)) {
  const el = ui(id), out = ui(id + '_v');
  const show = () => out.textContent = fmt[id](parseFloat(el.value));
  el.addEventListener('input', () => {
    show();
    if (!ac) return;
    if (id === 'vol') master.gain.setTargetAtTime(parseFloat(el.value), ac.currentTime, 0.02);
    if (id === 'fbk') delayFbk.gain.setTargetAtTime(parseFloat(el.value), ac.currentTime, 0.05);
    if (id === 'bpm') delayNode.delayTime.setTargetAtTime(dottedEighth(), ac.currentTime, 0.25);
  });
  show();
}

ui('go').addEventListener('click', async () => {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); buildGraph(); }
  if (ac.state === 'suspended') await ac.resume();
  if (running) {
    clearInterval(timer); timer = null; running = false;
    ui('go').textContent = 'start';
  } else {
    step = 0; bar = 0; nextNoteTime = ac.currentTime + 0.08;
    timer = setInterval(tick, TICK); running = true;
    ui('go').textContent = 'stop';
  }
});
</script>
</body>
</html>
