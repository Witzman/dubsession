name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The image builds, and serves /dub/
        run: |
          set -e
          docker build -t dubsession-ci .
          docker run -d --name ci -p 8081:80 dubsession-ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8081/healthz && break || sleep 1
          done
          # The prefix, not the root. A container that answers at / and not at
          # /dub/ passes every check that asks the wrong question.
          curl -sf http://127.0.0.1:8081/dub/ > /dev/null
          echo "serves /dub/"
          docker rm -f ci

      - name: The composition layer, and the loop detector
        run: |
          set -e
          # Green, then RED ON PURPOSE. A suite that is only ever run in the
          # direction where it passes is a decoration: `--prove-red` pins the
          # frozen loop back on and the run must fail, which is the only
          # evidence that the detector detects anything.
          node tools/tests/composition.test.mjs
          node tools/tests/composition.test.mjs --prove-red

  audio:
    # THE GATE THAT REPLACED THE EAR. The ear gate is suspended by owner
    # decision, so this is the whole of what stands between an audible defect
    # and the public site — and it only counts because GitHub requires it at
    # the merge button. It measures the built image, not the source tree: the
    # gate measures a page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: A browser that can render audio
        run: |
          set -e
          # `playwright` brings `playwright-core` at the same version and the
          # CLI that downloads a matching chromium. A mismatched pair looks
          # like a missing browser revision.
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: The gate is green, and RED ON PURPOSE
        run: |
          set -e
          docker build -t dubsession-gate .
          docker run -d --name gate -p 8082:80 dubsession-gate
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8082/dub/ > /dev/null && break || sleep 1
          done
          node tools/browser/gate-audio.mjs http://127.0.0.1:8082/dub/ --n 2
          # A gate that is only ever run in the direction where it passes is a
          # decoration. `--prove-red` throws the silence reasons away, so the
          # "silent with no reason" check MUST fire on the channel that is
          # empty by design; a run that passes with this flag exits 1.
          node tools/browser/gate-audio.mjs http://127.0.0.1:8082/dub/ --n 1 --prove-red
          docker rm -f gate

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No assistant attribution trailers
        run: |
          set -e
          range="origin/main..HEAD"
          git rev-parse --verify origin/main >/dev/null 2>&1 || range="HEAD"
          # A TRAILER, not a mention. `git log` indents the body four spaces,
          # so anchor to start-of-line-plus-space and require the colon or the
          # link form.
          if git log --format='%n%B' "$range" \
               | grep -nE '^[[:space:]]*(Co-Authored-By:|Co-authored-by:)' \
               || git log --format='%n%B' "$range" \
               | grep -nE 'Generated with \[Claude Code\]|🤖 Generated with'; then
            echo "::error::Every commit is authored by witzman alone."
            exit 1
          fi
          echo "clean"
      - name: No internal paths in what ships
        run: |
          set -e
          if grep -rnE 'notes/[A-Za-z0-9_./-]+\.(md|py|sh|json|txt)' \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::Process documents never enter this repository."
            exit 1
          fi
          echo "clean"
