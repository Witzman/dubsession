name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # THE SITE ROOT IS THE INSTRUMENT; `v2/` IS THE PROTOTYPE STAGE.
      # `v2/` deliberately sits OUTSIDE `public/`, because the Dockerfile
      # copies `public/` wholesale and the container must carry exactly one
      # thing. Owner decision 2026-09-17: there is one deploy and it is
      # https://witzman.de/dub. Pages is not that deploy — it is where the
      # successor can be played before anyone decides whether it replaces
      # anything.
      - name: Assemble the site — the instrument at the root, the prototype under /v2/
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -R public/dub/. _site/
          cp -R v2 _site/v2
          test -f _site/index.html    || { echo "::error::the instrument is missing from the site root"; exit 1; }
          test -f _site/v2/index.html || { echo "::error::the prototype stage is missing from /v2/"; exit 1; }
      - name: Package the assembled site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
